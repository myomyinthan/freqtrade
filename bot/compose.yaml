services:
  freqtrade:
    image: docker.io/freqtradeorg/freqtrade@sha256:1bb9a6b11a4dae39444331aa324b139dcd635f6a1c586ce9ecccac17994edc0c
    platform: linux/arm64
    command: ["--version"]
    init: true
    volumes:
      - ./configs/base.example.json:/freqtrade/bot/configs/base.example.json:ro
      - ./scripts:/freqtrade/bot/scripts:ro
      - ./strategies:/freqtrade/bot/strategies:ro
      - type: bind
        source: ./runtime/paper
        target: /freqtrade/bot/runtime/paper
        bind:
          create_host_path: false
